<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <linearGradient id="chassis_grad_5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#3f3f46"/>
    </linearGradient>
    <linearGradient id="screen_grad_5" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="glow_5" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="400" height="500" fill="#f8fafc" rx="16"/>
  <!-- Phone Body -->
  <g transform="translate(85, 35)">
    <!-- Drop Shadow -->
    <rect x="5" y="15" width="220" height="420" rx="36" fill="#000000" opacity="0.16" filter="url(#glow_5)"/>
    <!-- Metal Chassis Bezel -->
    <rect x="0" y="0" width="230" height="430" rx="36" fill="url(#chassis_grad_5)" stroke="#ffffff" stroke-width="2.5" stroke-opacity="0.5"/>
    <!-- AMOLED Screen -->
    <rect x="10" y="10" width="210" height="410" rx="28" fill="url(#screen_grad_5)"/>
    <!-- Top Dynamic Pill / Camera -->
    <rect x="85" y="20" width="60" height="14" rx="7" fill="#000000" stroke="#334155" stroke-width="1"/>
    <circle cx="125" cy="27" r="3" fill="#1e3a8a" opacity="0.9"/>
    <!-- Display UI / Branding -->
    <text x="115" y="125" text-anchor="middle" fill="#818cf8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" letter-spacing="2">2026 EDITION &bull; 5G</text>
    <text x="115" y="180" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="900">Galaxy S26+ 5G</text>
    <rect x="35" y="205" width="160" height="26" rx="13" fill="#4f46e5" fill-opacity="0.25" stroke="#818cf8" stroke-width="1"/>
    <text x="115" y="222" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">6.7" QHD+ 120HZ</text>
    <!-- Camera Spec Pill -->
    <rect x="45" y="240" width="140" height="22" rx="11" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="115" y="255" text-anchor="middle" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600">50MP Triple OIS Pro</text>
    <!-- Futuristic Wallpaper Accent Graphic -->
    <circle cx="115" cy="325" r="48" fill="#4f46e5" opacity="0.2" filter="url(#glow_5)"/>
    <path d="M70 350 Q115 285 160 350" fill="none" stroke="#818cf8" stroke-width="3.5" opacity="0.85"/>
    <circle cx="115" cy="325" r="24" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.6"/>
    <!-- Colorway Label -->
    <text x="115" y="395" text-anchor="middle" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500">Onyx Black</text>
  </g>
</svg>