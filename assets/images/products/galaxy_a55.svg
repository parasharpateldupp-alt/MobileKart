<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <linearGradient id="grad_galax" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3A6073"/>
      <stop offset="100%" stop-color="#5D8AA8"/>
    </linearGradient>
    <linearGradient id="screen_grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="400" height="500" fill="#f8f9fa" rx="16"/>
  <!-- Phone Body -->
  <g transform="translate(85, 35)">
    <!-- Shadow -->
    <rect x="5" y="15" width="220" height="420" rx="36" fill="#000000" opacity="0.15" filter="url(#glow)"/>
    <!-- Chassis -->
    <rect x="0" y="0" width="230" height="430" rx="36" fill="url(#grad_galax)" stroke="#ffffff" stroke-width="3" stroke-opacity="0.6"/>
    <!-- Screen Bezel -->
    <rect x="10" y="10" width="210" height="410" rx="28" fill="url(#screen_grad)"/>
    <!-- Punch Hole Camera -->
    <circle cx="115" cy="26" r="6" fill="#000000" stroke="#333" stroke-width="1.5"/>
    <circle cx="116" cy="25" r="2" fill="#1e40af" opacity="0.8"/>
    <!-- Screen Content / UI Mockup -->
    <text x="115" y="130" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" letter-spacing="1">5G READY</text>
    <text x="115" y="190" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="18" font-weight="900">Galaxy A55 5G</text>
    <rect x="35" y="215" width="160" height="28" rx="14" fill="#2563eb" fill-opacity="0.3" stroke="#3b82f6" stroke-width="1"/>
    <text x="115" y="234" text-anchor="middle" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Knox Vault Metal</text>
    <!-- Wallpaper Graphic -->
    <circle cx="115" cy="310" r="45" fill="url(#grad_galax)" opacity="0.8" filter="url(#glow)"/>
    <path d="M80 340 Q115 280 150 340" fill="none" stroke="#60a5fa" stroke-width="3" opacity="0.7"/>
    <!-- Color Label -->
    <text x="115" y="390" text-anchor="middle" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="11">Awesome Iceblue</text>
  </g>
</svg>